<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="#fcfaf2" stroke="#2d6a4f" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3,2" />
  <circle cx="50" cy="50" r="38" fill="url(#leafGradIcon)" />

  <!-- Twin Golden Wheat Ears -->
  <g fill="#fef3c7" stroke="#b45309" stroke-width="0.5">
    <path d="M28,44 C22,38 26,28 36,28 C34,36 32,42 28,44 Z" />
    <path d="M24,54 C18,48 20,38 30,38 C28,46 27,52 24,54 Z" />
    <path d="M26,65 C20,60 22,50 32,52 C30,59 29,63 26,65 Z" />
    <path d="M32,75 C27,72 28,62 38,66 C36,71 34,74 32,75 Z" />

    <path d="M72,44 C78,38 74,28 64,28 C66,36 68,42 72,44 Z" />
    <path d="M76,54 C82,48 80,38 70,38 C72,46 73,52 76,54 Z" />
    <path d="M74,65 C80,60 78,50 68,52 C70,59 71,63 74,65 Z" />
    <path d="M68,75 C73,72 72,62 62,66 C64,71 66,74 68,75 Z" />
  </g>

  <!-- Wooden Ghani Mortar Base -->
  <path d="M34,64 L66,64 L62,78 C62,81 38,81 38,78 Z" fill="#92400e" stroke="#fef3c7" stroke-width="1" />
  <rect x="33" y="62" width="34" height="4" rx="2" fill="#b45309" />
  
  <!-- Central Golden Oil Droplet -->
  <path d="M50,26 C56,35 66,48 66,58 C66,67 57.5,73 50,73 C42.5,73 34,67 34,58 C34,48 44,35 50,26 Z" fill="url(#goldGradIcon)" stroke="#fef3c7" stroke-width="1.2" />
  
  <!-- Sprout Leaf -->
  <path d="M50,64 C46,60 44,54 48,48 C50,45 52,48 52,54 C54,50 56,47 58,48 C59,53 56,59 50,64 Z" fill="#52b788" />
  
  <!-- Droplet shine -->
  <ellipse cx="46" cy="55" rx="3" ry="5.5" transform="rotate(-25 46 55)" fill="#fff" opacity="0.7" />
  
  <!-- Top star -->
  <polygon points="50,17 52,20 55,19 53,22 54,25 51,24 50,22 49,24 46,25 47,22 45,19 48,20" fill="#f59e0b" />
</svg>
